suite: postgres secret
templates:
  - charts/postgres-chart/templates/postgres-secret.yaml
tests:
  - it: should have the right name
    asserts:
      - equal:
          path: metadata.name
          value: adminer-postgres
  - it: should have the right labels
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: postgres
            app.kubernetes.io/component: "database"
  - it: should use the right password
    values:
      - values/postgres-secret-passwords.yaml
    asserts:
      - equal:
          path: stringData.password
          value: superdupercoolpassword
      - equal:
          path: stringData.replication-password
          value: evencoolerpassword
