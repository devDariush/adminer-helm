suite: adminer configmap
templates:
  - charts/adminer-chart/templates/adminer-cm.yaml
tests:
  - it: should have the right name
    asserts:
      - equal:
          path: metadata.name
          value: adminer
  - it: should have the correct default-server value
    asserts:
      - equal:
          path: data.default-server
          value: adminer-postgres-0.adminer-postgres.NAMESPACE.svc.cluster.local
