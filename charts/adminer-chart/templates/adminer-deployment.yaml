apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.global.adminer.appName }}
  labels:
    {{- include "adminer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "adminer.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "adminer.labels" . | nindent 8 }}
    spec:
      containers:
        - name: adminer
          image: adminer
          env:
            - name: ADMINER_DEFAULT_SERVER
              valueFrom:
                configMapKeyRef:
                  key: default-server
                  name: {{ .Values.global.adminer.appName }}
          resources:
            requests:
              cpu: {{ .Values.resources.minimumCPU | default "10m" }}
              memory: {{ .Values.resources.minimumRAM | default "10Mi" }}
            limits:
              cpu: {{ .Values.resources.maximumCPU | default "100m" }}
              memory: {{ .Values.resources.maximumRAM | default "100Mi" }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
